repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.17
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      # Fast tests only; GPU and slow tests run on demand.
      - id: pytest-fast
        name: pytest (fast)
        entry: python -m pytest -m "not gpu and not slow"
        language: system
        pass_filenames: false
        types: [python]
